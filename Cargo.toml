[workspace]
resolver = "2"
members = ["crates/dsl-macros"]

[workspace.dependencies]
# Real raster toolchain, consumed only by program crates under
# crates/raster-programs/ (never by the main crate — see charter invariant 6).
# Local builds use the sibling checkout; CI checks it out at the pinned rev
# declared as RASTER_PIN in .github/workflows/ci.yml. The pin-bump procedure
# is documented in the migration ADR.
raster = { path = "../raster/crates/raster", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

[package]
name = "raster-inference"
version = "0.1.0"
edition = "2021"
default-run = "raster-inference"

[features]
unchecked-raster-integrity = []

[[bin]]
name = "gemma-fp32-converter"
path = "tools/gemma-fp32-converter/main.rs"

[[bin]]
name = "gemma-det-num-wgt-converter"
path = "tools/gemma-det-num-wgt-converter/main.rs"

[[bin]]
name = "tiny-gemma-dev"
path = "tools/tiny-gemma-dev/main.rs"

[dependencies]
anyhow = "1"
fixed = "1.30.0"
half = "2"
memmap2 = "0.9.10"
minijinja = "2"
dsl-macros = { path = "crates/dsl-macros" }
rayon = "1.12.0"
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = "0.21"
postcard = { version = "1.1.3", features = ["alloc"] }
clap = { version = "4.6.1", features = ["derive"] }
toml = "1.1.2"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "det_inference"
harness = false

[[bench]]
name = "det_gemv"
harness = false
