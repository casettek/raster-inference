# Program crate for the `prompt.prepare` routine (WS3).
#
# Program crates under crates/raster-programs/ hold real raster tiles and
# sequences (charter invariant 6: real raster never enters the main crate).
# The sim path (src/routines/prompt_prepare/raster/) is the logical
# specification; the port plan lives at
# src/routines/prompt_prepare/raster_core/PORT_PLAN.md.
[package]
name = "raster-program-prompt-prepare"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "raster-program-prompt-prepare"
path = "src/main.rs"
required-features = ["std"]

[features]
default = ["std"]
std = [
    "raster/std",
    "raster-program-gemma-externals/std",
    "dep:raster-program-support",
]

[dependencies]
raster = { workspace = true }
serde = { workspace = true }
# Selectable schema types for the Gemma tokenizer committed external (WS2).
raster-program-gemma-externals = { path = "../gemma_externals", default-features = false }
# Output-file convention (WS2 §4), host boundary only.
raster-program-support = { path = "../_support", optional = true }

[dev-dependencies]
# Trace-event capture for the storage-refactor probes (P1–P4) and the
# trace-shape guard: tests install a capturing Publisher via
# `raster::init_with`.
raster-runtime = { workspace = true }
